# CI trigger. Fires on merges to specific branches.
# Ref: https://docs.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git#ci-triggers
# A pipeline with no CI trigger
trigger: none

# Name builds with the definition name, date, and build-count-for-that-day. For
# example, "BuildDefName_20210214.1".
# Refs:
# - https://docs.microsoft.com/en-us/azure/devops/pipelines/process/run-number
# - https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables
name: $(Build.DefinitionName)_$(date:yyMM).$(date:dd)$(rev:rrr)

variables:
- group: CoreSdk-PatRotatorAKV-XS

jobs:

  ####################
  # Visual Studio 2022
  ####################

  # Fody 6.x (used by the Costura projects) requires MSBuild 16 or newer, so the
  # build runs on the VS2022 pool rather than the retired VS2017 pool.
  - job: Win32Vs22Build
    displayName: DevTools Win32 VS2022 Build
    pool:
      name: xbl-1es-vs2022-pool
    timeoutInMinutes: 180
    strategy:
      matrix:
        AnyCPU_Debug:
          Platform: Any CPU
          Configuration: Debug
          Prefast: Disable
        AnyCPU_Release:
          Platform: Any CPU
          Configuration: Release
          Prefast: Disable
    steps:
      - template: Tasks/vs2022-build.yml
        parameters:
          platform: $(Platform)
          configuration: $(Configuration)
          prefast: $(Prefast)
